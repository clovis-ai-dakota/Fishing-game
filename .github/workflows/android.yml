name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (core, server, app UI) and debug APK
        run: ./gradlew :core:test :server:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deep-line-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-line-screenshots
          path: app/build/screenshots/*.png
