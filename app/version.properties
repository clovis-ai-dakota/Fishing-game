# The app's version (read by app/build.gradle.kts).
# versionCode: +1 for EVERY bundle uploaded to Google Play, on any track (internal, closed,
#   production). Play refuses a code it has seen before; the maximum is 2100000000.
# versionName: what players see, semantic versioning (1.0.1 fixes, 1.1.0 new features).
# CI can override both: -PdeeplineVersionCode=42 -PdeeplineVersionName=1.0.3
versionCode=1
versionName=1.0.0
